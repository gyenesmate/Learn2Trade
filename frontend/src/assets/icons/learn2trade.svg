<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- Candlestick chart mark matching Material "candlestick_chart" silhouette -->
  <g stroke="#3b82f6" stroke-width="1.75" stroke-linecap="round">
    <!-- Candle 1 -->
    <line x1="5" y1="4" x2="5" y2="20"/>
    <rect x="3.25" y="8" width="3.5" height="7" rx="0.5" fill="#3b82f6" stroke="none"/>
    <!-- Candle 2 -->
    <line x1="12" y1="3" x2="12" y2="21"/>
    <rect x="10.25" y="6" width="3.5" height="9" rx="0.5" fill="#3b82f6" stroke="none"/>
    <!-- Candle 3 -->
    <line x1="19" y1="5" x2="19" y2="19"/>
    <rect x="17.25" y="9" width="3.5" height="6" rx="0.5" fill="#3b82f6" stroke="none"/>
  </g>
</svg>
