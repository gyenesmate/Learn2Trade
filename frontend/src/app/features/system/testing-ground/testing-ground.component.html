<div class="w-full">
  <app-page-header [title]="pageTitle" />

  <section class="mb-8">
    <h3>Neumorphism</h3>
    <p>Opt-in <code>appNeumorphic</code> states (surface must match page bg for the illusion).</p>
    <div class="flex flex-wrap gap-6 p-6 rounded-lg bg-[var(--neu-bg)]">
      <div appNeumorphic neuState="raised" class="flex items-center justify-center w-[120px] h-20 text-sm font-medium text-[var(--color-text-primary)] select-none">
        Raised
      </div>
      <div appNeumorphic neuState="pressed" class="flex items-center justify-center w-[120px] h-20 text-sm font-medium text-[var(--color-text-primary)] select-none">
        Pressed
      </div>
      <div appNeumorphic neuState="floating" class="flex items-center justify-center w-[120px] h-20 text-sm font-medium text-[var(--color-text-primary)] select-none">
        Floating
      </div>
      <div
        appNeumorphic
        [neuInteractive]="true"
        class="flex items-center justify-center w-[120px] h-20 text-sm font-medium text-[var(--color-text-primary)] select-none"
        tabindex="0"
      >
        Interactive
      </div>
    </div>
  </section>

  <section class="mb-8">
    <h3>Crypto card</h3>
    <p>Demo of <code>crypto-card</code> with dummy Ethereum data.</p>
    <app-crypto-card [state]="'compact'" [data]="ethData"></app-crypto-card>
  </section>
</div>
