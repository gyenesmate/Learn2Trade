<div
  class="flex flex-col flex-auto min-h-0 h-full gap-4 overflow-hidden max-[960px]:h-auto max-[960px]:overflow-visible"
>
  <app-page-header [title]="pageTitle()" />

  @if (selectedCrypto(); as selectedCrypto) {
    <div class="flex-1 min-h-0 grid grid-cols-12 gap-4 max-[960px]:flex-none max-[960px]:grid-cols-1">
      <div
        class="col-span-7 min-w-0 min-h-0 flex flex-col max-[960px]:col-span-1 max-[960px]:min-h-[28rem]"
      >
        <app-crypto-card
          [state]="'detailed'"
          [data]="selectedCrypto"
          (livePriceChange)="onCardLivePrice($event)"
        />
      </div>

      <aside class="col-span-5 min-w-0 min-h-0 flex flex-col gap-4 overflow-auto max-[960px]:col-span-1">
        <div class="app-panel flex-1 min-h-0 overflow-auto">
          <div class="app-panel__body app-panel__body--flush">
            <app-data-table
              [title]="investmentsTableTitle"
              [columns]="investmentColumns"
              [data]="investmentRows()"
              [actionBar]="investmentActionBar"
              [rowActions]="investmentRowActions"
            />
          </div>
        </div>

        <div class="app-panel flex-1 min-h-0 overflow-auto">
          <div class="app-panel__body app-panel__body--flush">
            <app-data-table
              [title]="alertsTableTitle"
              [columns]="alertColumns"
              [data]="alertRows()"
              [actionBar]="alertActionBar"
              [rowActions]="alertRowActions"
            />
          </div>
        </div>
      </aside>
    </div>
  } @else {
    <div class="app-panel max-w-lg">
      <div class="app-panel__body">
        <h2 class="m-0">{{ 'TRADING.NOT_FOUND_TITLE' | translate }}</h2>
        <p>{{ 'TRADING.NOT_FOUND_BODY' | translate: { id: selectedId() } }}</p>
        <a mat-flat-button routerLink="/app/markets">{{ 'TRADING.GO_BACK' | translate }}</a>
      </div>
    </div>
  }
</div>
