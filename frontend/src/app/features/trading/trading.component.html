<div class="crypto-detail-page">
  <app-page-header [title]="pageTitle()" />

  @if (selectedCrypto(); as selectedCrypto) {
    <div class="crypto-detail-layout">
      <div class="crypto-detail-chart">
        <app-crypto-card
          [state]="'detailed'"
          [data]="selectedCrypto"
          (livePriceChange)="onCardLivePrice($event)"
        />
      </div>

      <aside class="crypto-detail-side">
        <div class="app-panel crypto-detail-side__panel">
          <div class="app-panel__body app-panel__body--flush">
            <app-data-table
              [title]="'Investments'"
              [columns]="investmentColumns"
              [data]="investmentRows()"
              [actionBar]="investmentActionBar"
              [rowActions]="investmentRowActions"
            />
          </div>
        </div>

        <div class="app-panel crypto-detail-side__panel">
          <div class="app-panel__body app-panel__body--flush">
            <app-data-table
              [title]="'Alerts'"
              [columns]="alertColumns"
              [data]="alertRows()"
              [actionBar]="alertActionBar"
              [rowActions]="alertRowActions"
            />
          </div>
        </div>
      </aside>
    </div>
  } @else {
    <div class="app-panel crypto-not-found">
      <div class="app-panel__body">
        <h2 class="m-0">Crypto not found</h2>
        <p>No crypto with id: <strong>{{ selectedId() }}</strong></p>
        <a mat-flat-button routerLink="/app/markets">Go back</a>
      </div>
    </div>
  }
</div>
