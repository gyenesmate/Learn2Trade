<div class="crypto-detail-page">
  <app-page-header [title]="pageTitle()" [actions]="headerActions()" />

  @if (selectedCrypto(); as selectedCrypto) {
    <div class="crypto-detail-sub">{{ selectedCrypto.symbol }} / {{ selectedCrypto.exchange_currency }}</div>
    <app-crypto-card #card [state]="'detailed'" [data]="selectedCrypto"></app-crypto-card>
    @if (activeInvestments().length) {
      <div class="crypto-detail-bottom">
        @for (inv of activeInvestments(); track inv) {
          <app-active-investment
            [investment]="inv"
            [crypto]="selectedCrypto"
            [currentPrice]="card?.livePrice || 0"
            (sell)="sellActiveInvestment(inv.id)">
          </app-active-investment>
        }
      </div>
    }
  } @else {
    <div class="crypto-not-found card">
      <h2>Crypto not found</h2>
      <p>No crypto with id: <strong>{{ selectedId() }}</strong></p>
      <a class="btn btn-primary" routerLink="/home">Go back</a>
    </div>
  }

</div>
