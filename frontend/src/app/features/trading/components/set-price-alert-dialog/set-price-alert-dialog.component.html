<app-base-dialog>
  <ng-container dialogTitle>Set alert for {{ data.crypto.name }}</ng-container>

  <div class="content">
    <p class="hint">
      Current price: <strong>${{ data.currentPrice | number: '1.2-6' }}</strong>
    </p>

    <mat-form-field class="full-width">
      <mat-label>Alert price</mat-label>
      <input
        matInput
        type="number"
        min="0"
        step="0.000001"
        [(ngModel)]="alertPrice"
        name="alertPrice"
      />
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Description (optional)</mat-label>
      <input matInput type="text" [(ngModel)]="description" name="description" />
    </mat-form-field>

    <p class="hint small">
      Type is set automatically: below if target is lower than current, otherwise above.
    </p>
  </div>

  <ng-container dialogActions>
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="confirm()"
      [disabled]="!alertPrice || alertPrice <= 0"
    >
      Set alert
    </button>
  </ng-container>
</app-base-dialog>
