<div class="home-page">
  <app-page-header [title]="pageTitle" [actions]="headerActions" />

  <main class="main-content">
    <section class="crypto-browser">
      <h2>Browse Cryptocurrencies</h2>
      <div class="crypto-grid">
        @for (crypto of cryptocurrencies(); track crypto) {
          <div class="crypto-card-slot">
            <app-crypto-card [state]="'compact'" [data]="crypto" [watchlistCryptoIds]="watchlistCryptoIds()"></app-crypto-card>
            <a class="btn btn-primary crypto-card__action" [routerLink]="['/crypto', crypto.id]">View Chart</a>
          </div>
        }
      </div>
    </section>

    <aside class="sidebar">
      <section class="watchlist">
        <h3>My Watchlist</h3>
        <div class="watchlist-table">
          <table class="simple-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Exchange</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              @for (crypto of watchlistCryptos(); track crypto) {
                <tr>
                  <td>{{ crypto.name }} ({{ crypto.symbol }})</td>
                  <td>{{ crypto.exchange_currency }}</td>
                  <td><a class="btn btn-primary" [routerLink]="['/crypto', crypto.id]">View</a></td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </section>
    </aside>
  </main>
</div>
