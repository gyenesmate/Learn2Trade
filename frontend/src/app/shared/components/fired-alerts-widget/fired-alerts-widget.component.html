@if (displayedAlerts(); as fired) {
  @if (fired.length) {
    <div class="fired-widget" [class.embedded]="embedded()">
      <div class="header">{{ title() }}</div>
      <div class="items">
        @for (a of fired; track a.id) {
          <div class="item">
            <div class="meta">
              <div class="title">
                {{ label(a) }}
                <span class="type">({{ a.alert_type }})</span>
              </div>
              <div class="sub">
                Target: {{ a.alert_price }}
                @if (a.description) {
                  <span> — {{ a.description }}</span>
                }
              </div>
            </div>
            <div class="actions">
              @if (!embedded()) {
                <button class="btn btn-secondary btn-sm" type="button" (click)="view(a)">View</button>
              }
              <button class="btn btn-error btn-sm" type="button" (click)="stop(a)">Stop</button>
            </div>
          </div>
        }
      </div>
    </div>
  }
}
