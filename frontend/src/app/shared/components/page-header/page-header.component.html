<header
  class="flex min-h-12 flex-col items-stretch gap-4 sm:flex-row sm:items-center sm:justify-between"
>
  <div class="flex min-w-0 items-center gap-2">
    @if (showBack()) {
      <button
        type="button"
        mat-icon-button
        class="shrink-0 text-[var(--color-text-primary)]"
        [attr.aria-label]="'COMMON.GO_BACK' | translate"
        (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
    }
    <h1
      class="m-0 truncate text-lg font-semibold leading-tight text-[var(--color-text-primary)]"
    >
      {{ title() | translate }}
    </h1>
  </div>

  @if (actions().length) {
    <div class="flex shrink-0 flex-wrap items-center justify-end gap-2 max-sm:w-full">
      @for (action of actions(); track action.label) {
        @if ((action.variant ?? 'primary') === 'secondary') {
          <button
            type="button"
            mat-stroked-button
            [disabled]="action.disabled === true"
            (click)="action.callback()">
            @if (action.icon) {
              <mat-icon>{{ action.icon }}</mat-icon>
            }
            {{ action.label | translate }}
          </button>
        } @else {
          <button
            type="button"
            mat-flat-button
            [disabled]="action.disabled === true"
            (click)="action.callback()">
            @if (action.icon) {
              <mat-icon>{{ action.icon }}</mat-icon>
            }
            {{ action.label | translate }}
          </button>
        }
      }
    </div>
  }
</header>
