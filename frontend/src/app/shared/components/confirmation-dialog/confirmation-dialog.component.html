<app-base-dialog>
  <ng-container dialogTitle>{{ data.title || 'Are you sure?' }}</ng-container>

  <p>{{ data.message }}</p>

  <ng-container dialogActions>
    <button mat-button type="button" (click)="onCancel()">{{ data.cancelText || 'Cancel' }}</button>
    <button mat-flat-button color="warn" type="button" (click)="onConfirm()">
      {{ data.confirmText || 'Confirm' }}
    </button>
  </ng-container>
</app-base-dialog>
