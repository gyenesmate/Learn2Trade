<div class="search-result flex items-center gap-sm w-full min-w-0">
  @if (result().icon; as icon) {
    <mat-icon class="search-result__icon shrink-0">{{ icon }}</mat-icon>
  }
  <div class="search-result__text flex flex-col min-w-0 flex-1">
    <span class="search-result__title">{{ result().title }}</span>
    @if (result().description; as description) {
      <span class="search-result__description text-muted">{{ description }}</span>
    }
  </div>
</div>
