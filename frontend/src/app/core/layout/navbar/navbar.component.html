<mat-toolbar class="toolbar" [class.mobile-toolbar]="isMobile()">
  <div class="navbar-left flex flex-1 items-center justify-start min-w-0">
    <button
      mat-icon-button
      type="button"
      class="menu-button"
      (click)="menuToggle.emit()"
      aria-label="Toggle sidebar"
      matTooltip="Toggle sidebar"
    >
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <div class="navbar-center flex flex-1 items-center justify-center min-w-0">
    <app-global-search class="navbar-search" />
  </div>

  <div class="navbar-right flex flex-1 items-center justify-end min-w-0 gap-sm">
    <button
      mat-icon-button
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      [matTooltip]="isDark() ? 'Light theme' : 'Dark theme'"
    >
      <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    @if (isLoggedIn()) {
      @if (user(); as u) {
        <div class="user-info">
          @if (!isMobile()) {
            <span class="balance tabular-nums">${{ u.balance }}</span>
            <span class="username">{{ u.username }}</span>
          }
          <button
            mat-icon-button
            type="button"
            [matMenuTriggerFor]="userMenu"
            aria-label="User menu"
          >
            <mat-icon>account_circle</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu">
            <button mat-menu-item type="button" (click)="navigateTo('/profile')">
              <mat-icon>person</mat-icon>
              Profile
            </button>
            <button mat-menu-item type="button" (click)="logout()">
              <mat-icon>logout</mat-icon>
              Logout
            </button>
          </mat-menu>
        </div>
      }
    }
  </div>
</mat-toolbar>

@if (isMobile()) {
  <nav class="bottom-nav" aria-label="Primary">
    @if (isLoggedIn()) {
      <button
        type="button"
        class="nav-item"
        (click)="navigateTo('/dashboard')"
        [class.active]="isActive('/dashboard')"
        [attr.aria-current]="isActive('/dashboard') ? 'page' : null"
      >
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </button>
    }
    <button
      type="button"
      class="nav-item"
      (click)="navigateTo('/markets')"
      [class.active]="isActive('/markets')"
      [attr.aria-current]="isActive('/markets') ? 'page' : null"
    >
      <mat-icon>show_chart</mat-icon>
      <span>Markets</span>
    </button>
    @if (isLoggedIn()) {
      <button
        type="button"
        class="nav-item"
        (click)="navigateTo('/profile')"
        [class.active]="isActive('/profile')"
        [attr.aria-current]="isActive('/profile') ? 'page' : null"
      >
        <mat-icon>account_balance_wallet</mat-icon>
        <span>Portfolio</span>
      </button>
    } @else {
      <button
        type="button"
        class="nav-item"
        (click)="navigateTo('/login')"
        [class.active]="isActive('/login')"
        [attr.aria-current]="isActive('/login') ? 'page' : null"
      >
        <mat-icon>login</mat-icon>
        <span>Login</span>
      </button>
    }
  </nav>
}
