<mat-toolbar
  class="toolbar sticky top-0 z-[100] flex h-14 min-h-14 max-h-14 items-center gap-3 overflow-hidden border-b border-border bg-surface px-3 text-[var(--color-text-primary)] shadow-none"
  [class.mobile-toolbar]="isMobile()"
>
  <div class="navbar-left flex flex-1 items-center justify-start min-w-0">
    <button
      mat-icon-button
      type="button"
      class="mr-2"
      (click)="menuToggle.emit()"
      [attr.aria-label]="'SHELL.TOGGLE_SIDEBAR' | translate"
      [matTooltip]="'SHELL.TOGGLE_SIDEBAR' | translate"
    >
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <div class="navbar-center flex flex-1 items-center justify-center min-w-0">
    <app-global-search class="w-full max-w-[480px]" />
  </div>

  <div class="navbar-right flex flex-1 items-center justify-end min-w-0 gap-3">
    <button
      mat-button
      type="button"
      class="language-selector"
      [matMenuTriggerFor]="langMenu"
      [attr.aria-label]="'COMMON.SELECT_LANGUAGE' | translate"
      aria-haspopup="menu"
    >
      <mat-icon>language</mat-icon>
      @if (!isMobile()) {
        <span class="language-selector__code">{{ currentLangCode() }}</span>
      }
    </button>
    <mat-menu #langMenu="matMenu" panelClass="language-menu">
      @for (lang of languages; track lang.code) {
        <button mat-menu-item type="button" (click)="selectLanguage(lang.code)">
          <span class="language-menu__row">
            <span>{{ lang.nativeName }}</span>
            <span class="language-menu__meta">{{ lang.code | uppercase }}</span>
          </span>
        </button>
      }
    </mat-menu>

    <button
      mat-icon-button
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="(isDark() ? 'SHELL.SWITCH_TO_LIGHT' : 'SHELL.SWITCH_TO_DARK') | translate"
      [matTooltip]="(isDark() ? 'SHELL.LIGHT_THEME' : 'SHELL.DARK_THEME') | translate"
    >
      <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    @if (isLoggedIn()) {
      @if (user(); as u) {
        <div class="user-info flex min-w-0 items-center gap-3">
          @if (!isMobile()) {
            <span class="balance tabular-nums text-sm font-semibold text-[var(--color-text-primary)] whitespace-nowrap">${{ u.balance }}</span>
            <span class="username max-w-40 truncate text-xs text-muted whitespace-nowrap">{{ u.username }}</span>
          }
          <button
            mat-icon-button
            type="button"
            [matMenuTriggerFor]="userMenu"
            [attr.aria-label]="'SHELL.USER_MENU' | translate"
          >
            <mat-icon>account_circle</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu">
            <button mat-menu-item type="button" (click)="navigateTo('/app/profile')">
              <mat-icon>person</mat-icon>
              {{ 'NAV.PROFILE' | translate }}
            </button>
            <button mat-menu-item type="button" (click)="logout()">
              <mat-icon>logout</mat-icon>
              {{ 'NAV.LOGOUT' | translate }}
            </button>
          </mat-menu>
        </div>
      }
    }
  </div>
</mat-toolbar>

@if (isMobile()) {
  <nav
    class="bottom-nav fixed inset-x-0 bottom-0 z-[100] flex items-center justify-around border-t border-border bg-surface py-1"
    [attr.aria-label]="'SHELL.PRIMARY_NAV' | translate"
  >
    @if (isLoggedIn()) {
      <button
        type="button"
        class="nav-item"
        (click)="navigateTo('/app/dashboard')"
        [class.active]="isActive('/app/dashboard')"
        [attr.aria-current]="isActive('/app/dashboard') ? 'page' : null"
      >
        <mat-icon>dashboard</mat-icon>
        <span>{{ 'NAV.DASHBOARD' | translate }}</span>
      </button>
    }
    <button
      type="button"
      class="nav-item"
      (click)="navigateTo('/app/markets')"
      [class.active]="isActive('/app/markets')"
      [attr.aria-current]="isActive('/app/markets') ? 'page' : null"
    >
      <mat-icon>show_chart</mat-icon>
      <span>{{ 'NAV.MARKETS' | translate }}</span>
    </button>
    @if (isLoggedIn()) {
      <button
        type="button"
        class="nav-item"
        (click)="navigateTo('/app/profile')"
        [class.active]="isActive('/app/profile')"
        [attr.aria-current]="isActive('/app/profile') ? 'page' : null"
      >
        <mat-icon>account_balance_wallet</mat-icon>
        <span>{{ 'NAV.PORTFOLIO' | translate }}</span>
      </button>
    } @else {
      <button
        type="button"
        class="nav-item"
        (click)="navigateTo('/auth/login')"
        [class.active]="isActive('/auth/login')"
        [attr.aria-current]="isActive('/auth/login') ? 'page' : null"
      >
        <mat-icon>login</mat-icon>
        <span>{{ 'NAV.LOGIN' | translate }}</span>
      </button>
    }
  </nav>
}
