<div class="sidebar__brand" [attr.title]="collapsed() ? 'Learn2Trade' : null">
  <mat-icon class="sidebar__logo" aria-hidden="true">candlestick_chart</mat-icon>
  @if (!collapsed()) {
    <span class="sidebar__wordmark">Learn2Trade</span>
  }
</div>

<nav class="sidebar__nav" aria-label="Primary">
  @for (link of mainLinks(); track link.id) {
    <button
      type="button"
      class="sidebar__link"
      [class.sidebar__link--active]="isActive(link)"
      [class.sidebar__link--disabled]="isDisabled(link)"
      [disabled]="isDisabled(link)"
      [attr.aria-label]="link.label"
      [attr.aria-current]="isActive(link) ? 'page' : null"
      [matTooltip]="collapsed() ? link.label : ''"
      matTooltipPosition="right"
      (click)="navigateTo(link)"
    >
      <mat-icon class="sidebar__link-icon" aria-hidden="true">{{ link.icon }}</mat-icon>
      @if (!collapsed()) {
        <span class="sidebar__link-label">{{ link.label }}</span>
      }
    </button>
  }
</nav>

@if (adminLinks().length > 0) {
  <nav class="sidebar__admin" aria-label="Admin">
    @if (!collapsed()) {
      <span class="sidebar__section-label">Admin</span>
    }
    @for (link of adminLinks(); track link.id) {
      <button
        type="button"
        class="sidebar__link"
        [class.sidebar__link--active]="isActive(link)"
        [class.sidebar__link--disabled]="isDisabled(link)"
        [disabled]="isDisabled(link)"
        [attr.aria-label]="link.label"
        [attr.aria-current]="isActive(link) ? 'page' : null"
        [matTooltip]="collapsed() ? link.label : ''"
        matTooltipPosition="right"
        (click)="navigateTo(link)"
      >
        <mat-icon class="sidebar__link-icon" aria-hidden="true">{{ link.icon }}</mat-icon>
        @if (!collapsed()) {
          <span class="sidebar__link-label">{{ link.label }}</span>
        }
      </button>
    }
  </nav>
}

@if (footerLinks().length > 0) {
  <nav class="sidebar__footer" aria-label="Account">
    @for (link of footerLinks(); track link.id) {
      <button
        type="button"
        class="sidebar__link"
        [class.sidebar__link--active]="isActive(link)"
        [class.sidebar__link--disabled]="isDisabled(link)"
        [disabled]="isDisabled(link)"
        [attr.aria-label]="link.label"
        [attr.aria-current]="isActive(link) ? 'page' : null"
        [matTooltip]="collapsed() ? link.label : ''"
        matTooltipPosition="right"
        (click)="navigateTo(link)"
      >
        <mat-icon class="sidebar__link-icon" aria-hidden="true">{{ link.icon }}</mat-icon>
        @if (!collapsed()) {
          <span class="sidebar__link-label">{{ link.label }}</span>
        }
      </button>
    }
  </nav>
}
