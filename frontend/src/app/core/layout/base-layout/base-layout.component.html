<div
  class="app-layout"
  [class.app-layout--sidebar-collapsed]="!sidebarExpanded()"
>
  <aside class="app-layout__sidebar" aria-label="Application sidebar">
    <app-sidebar
      [collapsed]="!sidebarExpanded()"
      (navigated)="onSidebarNavigated()"
    />
  </aside>

  <div class="app-layout__body">
    <app-navbar
      [isMobile]="isMobile()"
      (menuToggle)="toggleSidenav()"
    />

    <main class="app-layout__content" [class.app-layout__content--mobile]="isMobile()">
      <router-outlet />
    </main>
  </div>
</div>
