<a class="skip-link" href="#main-content">{{ 'SHELL.SKIP_TO_CONTENT' | translate }}</a>

<div
  class="app-layout"
  [class.app-layout--sidebar-collapsed]="!sidebarExpanded()"
>
  <aside class="app-layout__sidebar" [attr.aria-label]="'SHELL.APPLICATION_SIDEBAR' | translate">
    <app-sidebar
      [collapsed]="!sidebarExpanded()"
      (navigated)="onSidebarNavigated()"
    />
  </aside>

  <div class="app-layout__body">
    <app-navbar
      [isMobile]="isMobile()"
      (menuToggle)="toggleSidenav()"
    />

    <main
      id="main-content"
      class="app-layout__content"
      [class.app-layout__content--mobile]="isMobile()"
      tabindex="-1"
    >
      <router-outlet />
    </main>
  </div>
</div>
