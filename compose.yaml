services:
  postgres:
    image: postgres:17
    container_name: learn2trade-postgres

    environment:
      POSTGRES_DB: learn2trade
      POSTGRES_USER: learn2trade_user
      POSTGRES_PASSWORD: development_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn2trade_user -d learn2trade"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data: